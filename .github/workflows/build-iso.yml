name: Build ArkOS ISO
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Fix file permissions
        run: |
          chmod +x auto/config auto/clean build.sh
          chmod +x config/hooks/live/*.chroot
          chmod +x config/includes.chroot/usr/local/bin/*

      - name: Create dummy syslinux theme packages
        run: |
          mkdir -p config/packages.chroot
          for pkg in gfxboot-theme-ubuntu syslinux-themes-ubuntu-oneiric; do
            mkdir -p /tmp/${pkg}/DEBIAN
            cat > /tmp/${pkg}/DEBIAN/control <<EOC
          Package: ${pkg}
          Version: 1.0
          Architecture: all
          Maintainer: ArkOS <root@localhost>
          Description: Dummy placeholder so live-build's syslinux stage
           doesn't fail trying to fetch a package Ubuntu no longer ships.
          EOC
            dpkg-deb --build /tmp/${pkg} config/packages.chroot/${pkg}_1.0_all.deb
          done
          ls -la config/packages.chroot/

      - name: Build ArkOS.iso
        run: |
          sudo lb clean --purge || true
          sudo lb config --distribution jammy --architectures amd64 --binary-images iso-hybrid --archive-areas "main restricted universe multiverse" --debian-installer false --iso-application "ArkOS" --iso-volume "ArkOS" --iso-publisher "ArkOS Project"
          sudo lb build

      - name: Rename ISO
        run: |
          ls -la *.iso
          mv live-image-amd64.hybrid.iso ArkOS.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ArkOS-iso
          path: ArkOS.iso
          retention-days: 14
