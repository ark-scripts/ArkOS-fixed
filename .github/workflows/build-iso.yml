name: Build ArkOS ISO

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install live-build
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build

      - name: Fix file permissions
        run: |
          chmod +x auto/config auto/clean build.sh
          chmod +x config/hooks/live/*.chroot
          chmod +x config/includes.chroot/usr/local/bin/*

      - name: Build ArkOS.iso
        run: |
          sudo lb clean --purge || true
          sudo lb config --distribution jammy --architectures amd64 --binary-images iso-hybrid --archive-areas "main restricted universe multiverse" --debian-installer false --syslinux-theme "" --iso-application "ArkOS" --iso-volume "ArkOS" --iso-publisher "ArkOS Project"
          sudo lb build

      - name: Rename ISO
        run: |
          ls -la *.iso
          mv live-image-amd64.hybrid.iso ArkOS.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ArkOS-iso
          path: ArkOS.iso
          retention-days: 14
